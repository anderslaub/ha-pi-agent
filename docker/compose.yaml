# pi as the brain of Home Assistant assistants.
#   cd docker && cp .env.example .env    # set PI_BRIDGE_TOKEN and a model provider key
#   cp SYSTEM.md.example SYSTEM.md         # the assistant's system prompt
#   docker compose up -d --build
#   docker compose exec va-bridge pi       # pi inside the container: /login, /model, /va-bridge
# Local changes (ports, extra volumes, ...) go in compose.override.yaml (git-ignored), which docker compose
# merges automatically, so this file can stay as it is.
# Then add the "Pi Agent" integration in Home Assistant: http://<this host>:8787 and the same token.
services:
  va-bridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PI_VERSION: ${PI_VERSION:-latest}
    image: pi-va-bridge
    container_name: pi-va-bridge
    restart: unless-stopped
    # The container log has what was heard and said: keep at most 3 x 10 MB
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${PI_BRIDGE_PORT:-8787}:8787"
    # Lets the container reach services on the Docker host, e.g. LLAMA_BASE_URL=http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Everything in .env reaches the container, including provider credentials such as ANTHROPIC_API_KEY.
    # (Keys from your shell are deliberately not passed through.)
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the container the bridge always listens on 0.0.0.0:8787; PI_BRIDGE_PORT in .env is the host port.
      PI_BRIDGE_HOST: 0.0.0.0
      PI_BRIDGE_PORT: 8787
      # Bridge (see README "Bridge settings")
      PI_BRIDGE_TOKEN: ${PI_BRIDGE_TOKEN:?set PI_BRIDGE_TOKEN in .env}
      PI_BRIDGE_MODEL: ${PI_BRIDGE_MODEL:-}
      PI_BRIDGE_THINKING: ${PI_BRIDGE_THINKING:-}
      PI_BRIDGE_TOOLS: ${PI_BRIDGE_TOOLS:-}
      PI_BRIDGE_IDLE_MINUTES: ${PI_BRIDGE_IDLE_MINUTES:-120}
      PI_BRIDGE_BUDGET_S: ${PI_BRIDGE_BUDGET_S:-15}
      PI_BRIDGE_TASK_TIMEOUT_MIN: ${PI_BRIDGE_TASK_TIMEOUT_MIN:-10}
      PI_BRIDGE_WARMUP: ${PI_BRIDGE_WARMUP:-1}
      # Noise filter (README "Noise filter"), optional: with a TypeSafe API key Jev (typesafe/jev-latest) decides;
      # without one (and no PI_BRIDGE_SCREEN_MODEL) nothing is screened
      PI_BRIDGE_SCREEN_MODEL: ${PI_BRIDGE_SCREEN_MODEL:-}
      PI_BRIDGE_SCREEN_THRESHOLD: ${PI_BRIDGE_SCREEN_THRESHOLD:-0.3}
      PI_BRIDGE_SCREEN_UNKNOWN_THRESHOLD: ${PI_BRIDGE_SCREEN_UNKNOWN_THRESHOLD:-0.8}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      # Sense of time, short-term memory, wake-ups (README "Sense of time, short-term memory and wake-ups")
      # Empty: Home Assistant's time zone
      PI_BRIDGE_TIMEZONE: ${PI_BRIDGE_TIMEZONE:-}
      PI_BRIDGE_MEMORY: ${PI_BRIDGE_MEMORY:-1}
      PI_BRIDGE_SUMMARY_AFTER_MIN: ${PI_BRIDGE_SUMMARY_AFTER_MIN:-1}
      PI_BRIDGE_MEMORY_KEEP_DAYS: ${PI_BRIDGE_MEMORY_KEEP_DAYS:-3}
      PI_BRIDGE_WAKEUPS: ${PI_BRIDGE_WAKEUPS:-1}
      # the speaker recognition service behind a speech-to-text that labels who is speaking (empty: no voice tools)
      PI_BRIDGE_SPEAKER_ID_URL: ${PI_BRIDGE_SPEAKER_ID_URL:-}
      PI_BRIDGE_SPEAKER_ID_TOKEN: ${PI_BRIDGE_SPEAKER_ID_TOKEN:-}
      # an unknown voice is asked who it is again after this many days
      PI_BRIDGE_VOICE_ASK_AGAIN_DAYS: ${PI_BRIDGE_VOICE_ASK_AGAIN_DAYS:-30}
      # Past conversations: the assistant can search, read and delete them; deleted after this many days (0: never)
      PI_BRIDGE_HISTORY: ${PI_BRIDGE_HISTORY:-1}
      PI_BRIDGE_CONVERSATION_KEEP_DAYS: ${PI_BRIDGE_CONVERSATION_KEEP_DAYS:-30}
      # Long-lived Home Assistant access token, for pi's mcp.json ("Authorization": "Bearer ${HA_TOKEN}"):
      # keeps the token out of prompts and config files
      HA_TOKEN: ${HA_TOKEN:-}
      # Extra pi packages installed on first start, space separated
      PI_PACKAGES: ${PI_PACKAGES:-}
      PI_ALLOW_SCRIPTS: ${PI_ALLOW_SCRIPTS:-}
      TZ: ${TZ:-UTC}
      # Files in the workspace are owned by this host user (id -u / id -g)
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      # The assistant's working folder, shared with the host
      - ${WORKSPACE:-./workspace}:/workspace
      # The assistant's system prompt: docker/SYSTEM.md (git-ignored; copy it from SYSTEM.md.example).
      # Read for every new conversation, so edits apply without a restart.
      - type: bind
        source: ./SYSTEM.md
        target: /workspace/.pi/va-bridge/SYSTEM.md
        read_only: true
        bind:
          create_host_path: false
      # pi's own state: logins, settings, installed packages, session history
      - pi-agent:/home/node/.pi

volumes:
  pi-agent:
